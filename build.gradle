plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = artifact_group
version = artifact_version
description = artifact_description

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// The sources and the fixtures both contain non-ASCII characters, so neither the compiler nor the
// test JVM may fall back to the platform default encoding.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

gradlePlugin {
    website = "https://github.com/$author/$artifact_name"
    vcsUrl = "https://github.com/$author/$artifact_name"
    plugins {
        create(artifact_id) {
            id = "${artifact_group}.${artifact_id}"
            implementationClass = "${artifact_group}.MyPlugin"
            displayName = display_name
            description = artifact_description
            tags = ['example', 'tutorial']
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
    defaultCharacterEncoding = 'UTF-8'

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
        stackTraceFilters 'entryPoint'
    }
}
